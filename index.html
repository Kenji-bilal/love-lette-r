<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>رسالة خاصة</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Cairo',sans-serif;
}

body{
  background:linear-gradient(180deg,#ffd6e8,#f3e5f5);
  overflow:hidden;
}

/* الواجهات */
.section{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}
.section.active{
  display:flex;
}

/* المؤثرات */
.effects{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
}
.effect{
  position:absolute;
  bottom:-40px;
  animation:float 7s linear infinite;
}

/* الظرف */
.envelope{
  width:260px;
  height:170px;
  background:#ff8fb1;
  border-radius:16px;
  box-shadow:0 20px 40px rgba(0,0,0,.2);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:18px;
  cursor:pointer;
  position:relative;
}
.envelope::before{
  content:'';
  position:absolute;
  inset:0;
  background:#ff6f9f;
  clip-path:polygon(0 0,100% 0,50% 60%);
  border-radius:16px;
}
.envelope span{
  color:#fff;
  z-index:2;
  font-size:1.1rem;
}

/* فتح الظرف */
.open{
  animation:openEnv 2.5s ease forwards;
}

/* واجهة التهيئة */
.prepare{
  font-size:1.5rem;
  line-height:2.3;
  color:#6a3b5d;
}
.prepare span{
  display:block;
  opacity:0;
  animation:appear 1s ease forwards;
}
.prepare span:nth-child(1){animation-delay:0s}
.prepare span:nth-child(2){animation-delay:1.4s}
.prepare span:nth-child(3){animation-delay:2.8s}
.prepare span:nth-child(4){animation-delay:4.2s}
.prepare span:nth-child(5){animation-delay:5.6s}

/* الورقة */
.paper{
  background:#fff;
  border-radius:20px;
  padding:32px;
  max-width:360px;
  box-shadow:0 40px 80px rgba(0,0,0,.25);
  animation:rise 1.2s ease;
}
.paper h2{
  color:#ff5f9e;
  margin-bottom:16px;
}
.paper p{
  line-height:2;
  color:#555;
  font-size:1.05rem;
}

/* الحركات */
@keyframes float{
  to{
    transform:translateY(-120vh) scale(1.5);
    opacity:0;
  }
}
@keyframes rise{
  from{
    transform:translateY(80px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}
@keyframes openEnv{
  to{
    transform:scale(.9) translateY(-20px);
  }
}
@keyframes appear{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
</style>
</head>

<body>

<div class="effects" id="effects"></div>

<!-- واجهة 1 : الغلاف -->
<div class="section active" id="s1">
  <div class="envelope" onclick="goToOpen()">
    <span>💌 وصلتِك رسالة</span>
  </div>
</div>

<!-- واجهة 2 : الفتح -->
<div class="section" id="s2">
  <div class="envelope open">
    <span>يتم فتح الرسالة…</span>
  </div>
</div>

<!-- واجهة 3 : التهيئة -->
<div class="section" id="s3">
  <div class="prepare">
    <span>قبل أن تقرئي…</span>
    <span>خذي نفسًا عميقًا،</span>
    <span>فبعض الكلمات</span>
    <span>تُكتب بصدق،</span>
    <span>وتُقرأ بالقلب 🤍</span>
  </div>
</div>

<!-- واجهة 4 : الرسالة -->
<div class="section" id="s4">
  <div class="paper">
    <h2>دعاء 🌸</h2>
    <p>
      هذه ليست مجرد رسالة،<br>
      بل شكر صادق من القلب…<br><br>

      شكرًا لأنكِ كنتِ لطيفة،<br>
      شكرًا لأنكِ أضفتِ نورًا<br>
      دون أن تطلبي شيئًا.<br><br>

      وجودك مُقدَّر،<br>
      وهذا كل ما أردت قوله كتكوتتي  💗
    </p>
  </div>
</div>

<script>
const s1=document.getElementById('s1');
const s2=document.getElementById('s2');
const s3=document.getElementById('s3');
const s4=document.getElementById('s4');

const effects=document.getElementById('effects');
const icons=['💗','✨','🌸','💫','🐰'];

function spawn(){
  const e=document.createElement('div');
  e.className='effect';
  e.textContent=icons[Math.floor(Math.random()*icons.length)];
  e.style.left=Math.random()*100+'vw';
  e.style.fontSize=(18+Math.random()*20)+'px';
  effects.appendChild(e);
  setTimeout(()=>e.remove(),9000);
}
setInterval(spawn,500);

function goToOpen(){
  s1.classList.remove('active');
  s2.classList.add('active');

  for(let i=0;i<20;i++)spawn();

  setTimeout(()=>{
    s2.classList.remove('active');
    s3.classList.add('active');
  },2500);

  setTimeout(()=>{
    s3.classList.remove('active');
    s4.classList.add('active');
  },9500);
}
</script>

</body>
</html>
